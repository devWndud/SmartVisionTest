<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autonomous Driving Vision - 웹 인터페이스</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }
        
        .upload-section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            border: 2px dashed #667eea;
        }
        
        .file-input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }
        
        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }
        
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            background: white;
        }
        
        input[type="file"]:hover {
            border-color: #667eea;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        
        .results-section {
            margin-top: 30px;
            display: none;
        }
        
        .results-section.active {
            display: block;
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        
        .result-card {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e9ecef;
        }
        
        .result-card h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .result-image {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        
        .angle-info {
            background: white;
            padding: 15px;
            border-radius: 10px;
            margin-top: 10px;
        }
        
        .angle-value {
            font-size: 2em;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 10px 0;
        }
        
        .angle-label {
            text-align: center;
            color: #666;
            font-size: 0.9em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }
        
        .stat-item {
            background: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .stat-value {
            font-size: 2em;
            font-weight: bold;
            color: #764ba2;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-top: 5px;
        }
        
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error {
            background: #fee;
            color: #c33;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
            display: none;
        }
        
        .error.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .result-grid {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Autonomous Driving Vision</h1>
        <p class="subtitle">장애물 탐지 및 경로 계획 시스템</p>
        
        <div class="upload-section">
            <form id="uploadForm">
                <div class="file-input-group">
                    <label for="imgFile">📷 이미지 파일 (Image)</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="imgFile" name="img" accept="image/*" required>
                    </div>
                </div>
                
                <div class="file-input-group">
                    <label for="pointFile">☁️ 포인트 클라우드 파일 (Point Cloud) - 선택사항</label>
                    <div class="file-input-wrapper">
                        <input type="file" id="pointFile" name="point" accept=".npy,.bin,.dat">
                    </div>
                    <small style="color: #666; margin-top: 5px; display: block;">
                        포인트 클라우드가 없으면 더미 데이터를 사용합니다.
                    </small>
                </div>
                
                <button type="submit" class="btn" id="submitBtn">🔍 분석 시작</button>
            </form>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 15px; color: #666;">이미지를 분석 중입니다...</p>
        </div>
        
        <div class="error" id="error"></div>
        
        <div class="results-section" id="results">
            <h2 style="color: #333; margin-bottom: 20px;">📊 분석 결과</h2>
            
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="movingCount">0</div>
                    <div class="stat-label">이동 객체</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="fixedCount">0</div>
                    <div class="stat-label">고정 객체</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="recommendedAngle">0°</div>
                    <div class="stat-label">권장 각도</div>
                </div>
            </div>
            
            <div class="result-grid">
                <div class="result-card">
                    <h3>🎯 객체 탐지 결과</h3>
                    <img id="resultImage" class="result-image" alt="결과 이미지">
                </div>
                
                <div class="result-card">
                    <h3>🧭 경로 계획</h3>
                    <div class="angle-info">
                        <div class="angle-label">권장 주행 각도</div>
                        <div class="angle-value" id="angleValue">0°</div>
                        <div class="angle-label" id="angleDescription">장애물이 가장 적은 방향</div>
                    </div>
                    <div style="margin-top: 15px;">
                        <h4 style="color: #666; margin-bottom: 10px;">추천 각도 목록:</h4>
                        <div id="angleList" style="color: #333;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const form = document.getElementById('uploadForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const error = document.getElementById('error');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // UI 초기화
            submitBtn.disabled = true;
            loading.classList.add('active');
            results.classList.remove('active');
            error.classList.remove('active');
            
            const formData = new FormData(form);
            
            try {
                const response = await fetch('/vision_process', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                // 결과 표시
                if (data.image) {
                    document.getElementById('resultImage').src = data.image;
                }
                
                if (data.recommended_angle !== undefined) {
                    document.getElementById('recommendedAngle').textContent = 
                        data.recommended_angle.toFixed(1) + '°';
                    document.getElementById('angleValue').textContent = 
                        data.recommended_angle.toFixed(1) + '°';
                }
                
                document.getElementById('movingCount').textContent = data.moving_objects || 0;
                document.getElementById('fixedCount').textContent = data.fixed_objects || 0;
                
                // 각도 목록 표시
                if (data.angles && data.angles.length > 0) {
                    const angleListHtml = data.angles.map((angle, idx) => 
                        `<div style="padding: 5px; background: ${idx === 0 ? '#e7f3ff' : '#f8f9fa'}; 
                         margin: 5px 0; border-radius: 5px;">
                            ${idx + 1}. ${angle.toFixed(1)}°
                        </div>`
                    ).join('');
                    document.getElementById('angleList').innerHTML = angleListHtml;
                }
                
                results.classList.add('active');
                
            } catch (err) {
                error.textContent = '오류 발생: ' + err.message;
                error.classList.add('active');
            } finally {
                submitBtn.disabled = false;
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
